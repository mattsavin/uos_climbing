version: 2

updates:
    # Production + dev dependencies: grouped weekly PR so the audit gate
    # and CI validate everything together
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      # All changes flow dev -> beta soak -> main promotion; never straight to prod
      target-branch: 'dev'
      groups:
          all-dependencies:
              applies-to: version-updates
              patterns:
                  - '*'
      # TypeScript 7 is now npm 'latest', but typescript-eslint@8 peers cap
      # TS at <6.1.0, so Dependabot's updater fails the whole grouped job
      # with "Error while updating peer dependency" when it tries to
      # resolve it. Hold back TS majors until its peers declare support.
      ignore:
          - dependency-name: 'typescript'
            versions:
                - '>=6'

    # Keep GitHub Actions current (Node-runtime deprecations, SHA pinning)
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
